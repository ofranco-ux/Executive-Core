<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Core - WFM Forecast ML</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #111318;
            --bg-sidebar: #1a1d24;
            --bg-card: #181b22;
            --border-color: #272b35;
            --input-bg: #121419;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary-blue: #3b82f6;
            --primary-blue-hover: #2563eb;
            --green-accent: #34d399;
            --red-accent: #f87171;
            --badge-bg: rgba(52, 211, 153, 0.1);
            --badge-border: rgba(52, 211, 153, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar de Configuración */
        .sidebar {
            width: 300px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="file"] {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .form-group input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Input de archivo estilizado */
        input[type="file"]::file-selector-button {
            background-color: #2a2f3d;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 10px;
            transition: background-color 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #373e50;
        }

        .btn-submit {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .btn-submit:hover {
            background-color: var(--primary-blue-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background-color: #2d3748;
            color: #718096;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Contenido Principal Dashboard */
        .main-content {
            flex: 1;
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .header-title {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .badge-ml {
            background-color: var(--badge-bg);
            color: var(--green-accent);
            border: 1px solid var(--badge-border);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-ml::before {
            content: '';
            width: 7px;
            height: 7px;
            background-color: var(--green-accent);
            border-radius: 50%;
            display: inline-block;
        }

        /* Tabla Estilizada */
        .table-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .table-responsive {
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
        }

        thead {
            position: sticky;
            top: 0;
            background-color: #14171d;
            z-index: 10;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            white-space: nowrap;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .cell-bold {
            font-weight: 600;
            color: #ffffff;
        }

        .cell-delta {
            font-weight: 600;
        }

        .cell-sl {
            font-weight: 600;
        }

        /* Spinner Carga */
        .loading-state {
            display: none;
            text-align: center;
            padding: 60px 20px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Panel Izquierdo: Parámetros WFM -->
    <div class="sidebar">
        <h2>Parámetros WFM</h2>
        <form id="wfm-form">
            <div class="form-group">
                <label for="file">Archivo Excel (.xlsx)</label>
                <input type="file" id="file" name="file" accept=".xlsx, .xls" required>
            </div>

            <div class="form-group">
                <label for="dias">Días a Proyectar</label>
                <input type="number" id="dias" name="dias" value="30" min="1" max="90">
            </div>

            <div class="form-group">
                <label for="target_sl">SLA Objetivo (%)</label>
                <input type="number" id="target_sl" name="target_sl" value="80" step="1">
            </div>

            <div class="form-group">
                <label for="target_time">Tiempo Objetivo (seg)</label>
                <input type="number" id="target_time" name="target_time" value="20" step="1">
            </div>

            <div class="form-group">
                <label for="merma">Merma / Shrinkage (%)</label>
                <input type="number" id="merma" name="merma" value="30" step="1">
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">Procesar Pronóstico</button>
        </form>
    </div>

    <!-- Panel Derecho: Visualización Dashboard -->
    <div class="main-content">
        <div class="header-container">
            <h1 class="header-title">Motor Predictivo Executive Core</h1>
            <span class="badge-ml">ML Ridge + Holt-Winters Activo</span>
        </div>

        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Ejecutando modelo ML e integrando malla de turnos...</p>
        </div>

        <div class="table-card" id="table-card" style="display: none;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Campaña</th>
                            <th>Fecha</th>
                            <th>Día</th>
                            <th>Intervalo</th>
                            <th>Llamadas (ML)</th>
                            <th>AHT (s)</th>
                            <th>Agentes Req.</th>
                            <th>Agentes Prog.</th>
                            <th>Delta Staffing</th>
                            <th>SL Proyectado</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('wfm-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(e.target);
            const loading = document.getElementById('loading');
            const tableCard = document.getElementById('table-card');
            const tableBody = document.getElementById('table-body');
            const btnSubmit = document.getElementById('btn-submit');

            loading.style.display = 'block';
            tableCard.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Calculando...';

            try {
                // Ruta relativa directa a Render
                const response = await fetch('/api/process', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Error en el servidor');
                }

                const data = await response.json();
                tableBody.innerHTML = '';

                data.forEach(row => {
                    const tr = document.createElement('tr');

                    const deltaColor = row.Delta_Net_Staffing >= 0 ? 'var(--green-accent)' : 'var(--red-accent)';
                    const slColor = row.SL_Proyectado >= 80 ? 'var(--green-accent)' : 'var(--red-accent)';

                    tr.innerHTML = `
                        <td class="cell-bold">${row.Campaña}</td>
                        <td>${row.Fecha}</td>
                        <td>${row.Día_Semana}</td>
                        <td>${row.Intervalo}</td>
                        <td>${row.Llamadas}</td>
                        <td>${row.AHT}</td>
                        <td>${row.Agentes_Requeridos}</td>
                        <td>${row.Agentes_Programados_Reales}</td>
                        <td class="cell-delta" style="color: ${deltaColor};">${row.Delta_Net_Staffing}</td>
                        <td class="cell-sl" style="color: ${slColor};">${row.SL_Proyectado}%</td>
                    `;
                    tableBody.appendChild(tr);
                });

                loading.style.display = 'none';
                tableCard.style.display = 'block';

            } catch (error) {
                alert('Error al procesar el archivo: ' + error.message);
                loading.style.display = 'none';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Procesar Pronóstico';
            }
        });
    </script>
</body>
</html>
