<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <title>Workforce Capacity Forecast — C-Suite Analytics</title>
    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://jsdelivr.net"></script>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#070B14',
                            surface: '#111827',
                            border: '#1F2937', 
                            primary: '#3B82F6', 
                            primaryHover: '#60A5FA',
                            accentCyan: '#22D3EE',
                            accentEmerald: '#34D399',
                            accentRose: '#FB7185',
                            accentAmber: '#FBBF24',
                            accentViolet: '#A78BFA'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070B14; color: #E2E8F0; }
        .glass-panel { background-color: #111827; border: 1px solid #1F2937; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; }
        .input-clean { background-color: #0F172A; border: 1px solid #334155; color: #F8FAFC; }
    </style>
</head>
<body class="p-6 md:p-8 min-h-screen">
    <header class="flex justify-between items-center bg-[#111827] border border-[#1F2937] shadow-lg rounded-2xl p-6 mb-8 flex-wrap gap-4">
        <h1 class="text-2xl font-bold text-white tracking-tight">Workforce Capacity Forecast</h1>
    </header>
    <div class="grid grid-cols-12 gap-8">
        <aside id="panelControl" class="col-span-12 lg:col-span-3 glass-panel p-6 rounded-[1.5rem] space-y-6">
            <form id="wfmForm" class="space-y-4">
                <input type="number" name="target_sl" id="targetSl" value="80" class="input-clean p-3 rounded-xl">
                <input type="number" name="target_time" id="targetTime" value="20" class="input-clean p-3 rounded-xl">
                <button type="button" id="btnRunPlan" class="w-full bg-blue-600 text-white font-bold p-4 rounded-xl">▶ RUN PLAN</button>
            </form>
        </aside>
        <main class="col-span-12 lg:col-span-9 space-y-6">
            <section class="glass-panel p-5 rounded-2xl">
                <table class="w-full text-left border-collapse">
                    <tbody id="tablaCuerpo">
                        <tr><td colspan="6" class="py-8 text-center text-slate-500 font-mono text-xs">Cargue datos ejecutando el plan operativo...</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script>
        const API_BASE_URL = 'https://onrender.com';
        document.getElementById('btnRunPlan').addEventListener('click', async () => {
            const btn = document.getElementById('btnRunPlan');
            btn.disabled = true;
            btn.innerText = '🧠 CALCULANDO...';
            try {
                const response = await fetch(`${API_BASE_URL}/api/process`, { method: 'POST', body: new FormData(document.getElementById('wfmForm')) });
                const data = await response.json();
                console.log(data);
            } catch (error) {
                alert("Error procesando simulación.");
            } finally {
                btn.disabled = false;
                btn.innerText = '▶ RUN PLAN';
            }
        });
    </script>
</body>
</html>
