<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Core - WFM & Forecast AI Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121417;
            --card-bg: #1e2228;
            --border-color: #2e3440;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar de Configuración */
        .sidebar {
            width: 320px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-group input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 12px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* Panel Principal */
        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .status-badge {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Tabla de Resultados */
        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-muted);
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Indicador de Carga */
        .loading-overlay {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid var(--primary-color);
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Sidebar de Parámetros -->
    <div class="sidebar">
        <h2>Parámetros WFM</h2>
        <form id="upload-form">
            <div class="form-group">
                <label for="file">Archivo Excel (.xlsx)</label>
                <input type="file" id="file" name="file" accept=".xlsx, .xls" required>
            </div>
            
            <div class="form-group">
                <label for="dias">Días a Proyectar</label>
                <input type="number" id="dias" name="dias" value="30" min="1" max="90">
            </div>

            <div class="form-group">
                <label for="target_sl">SLA Objetivo (%)</label>
                <input type="number" id="target_sl" name="target_sl" value="80" step="1">
            </div>

            <div class="form-group">
                <label for="target_time">Tiempo Objetivo (seg)</label>
                <input type="number" id="target_time" name="target_time" value="20" step="1">
            </div>

            <div class="form-group">
                <label for="merma">Merma / Shrinkage (%)</label>
                <input type="number" id="merma" name="merma" value="20" step="1">
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">Procesar Pronóstico</button>
        </form>
    </div>

    <!-- Contenido Principal -->
    <div class="main-content">
        <div class="header">
            <h1>Motor Predictivo Executive Core</h1>
            <span class="status-badge">ML Ridge + Holt-Winters Activo</span>
        </div>

        <div id="loading" class="loading-overlay">
            <div class="spinner"></div>
            <p>Entrenando modelos y generando proyección futura...</p>
        </div>

        <div class="table-container" id="results-container" style="display: none;">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>Campaña</th>
                        <th>Fecha</th>
                        <th>Día</th>
                        <th>Intervalo</th>
                        <th>Llamadas (ML)</th>
                        <th>AHT (s)</th>
                        <th>Agentes Req.</th>
                        <th>Agentes Prog.</th>
                        <th>Delta Staffing</th>
                        <th>SL Proyectado</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Registros dinámicos -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const form = e.target;
            const formData = new FormData(form);

            const loading = document.getElementById('loading');
            const resultsContainer = document.getElementById('results-container');
            const tableBody = document.getElementById('table-body');
            const btnSubmit = document.getElementById('btn-submit');

            loading.style.display = 'block';
            resultsContainer.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Procesando...';

            try {
                // LLAMADA RELATIVA A LA API (Soporta Render sin importar el dominio)
                const response = await fetch('/api/process', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Error en el servidor');
                }

                const data = await response.json();

                // Limpiar tabla previa
                tableBody.innerHTML = '';

                // Renderizar primeros 500 registros para fluidez en pantalla
                data.slice(0, 500).forEach(row => {
                    const tr = document.createElement('tr');
                    
                    const deltaColor = row.Delta_Net_Staffing >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
                    const slColor = row.SL_Proyectado >= 80 ? 'var(--accent-green)' : 'var(--accent-red)';

                    tr.innerHTML = `
                        <td><strong>${row.Campaña}</strong></td>
                        <td>${row.Fecha}</td>
                        <td>${row.Día_Semana}</td>
                        <td>${row.Intervalo}</td>
                        <td>${row.Llamadas}</td>
                        <td>${row.AHT}</td>
                        <td>${row.Agentes_Requeridos}</td>
                        <td>${row.Agentes_Programados_Reales}</td>
                        <td style="color: ${deltaColor}; font-weight: 600;">${row.Delta_Net_Staffing}</td>
                        <td style="color: ${slColor}; font-weight: 600;">${row.SL_Proyectado}%</td>
                    `;
                    tableBody.appendChild(tr);
                });

                loading.style.display = 'none';
                resultsContainer.style.display = 'block';

            } catch (error) {
                alert('Error procesando los datos: ' + error.message);
                loading.style.display = 'none';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Procesar Pronóstico';
            }
        });
    </script>
</body>
</html>
